<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일정 관리 목업 v6 (PC)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#282C48;--brand:#5C53DB;--brand-soft:#eef0ff;--ink:#191f28;--sub:#6b7684;--line:#e5e8eb;--bg:#f4f5f9;--card:#fff;--green:#16a34a;--red:#ef4444;--blue:#3b82f6}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.note{background:#fffbeb;border-bottom:1px solid #fde68a;color:#92400e;padding:8px 16px;font-size:12.5px}
.top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 24px;height:58px}
.top h1{font-size:16px;margin:0}
.seg{display:flex;gap:4px;background:#f2f4f6;padding:4px;border-radius:12px}
.seg button{padding:8px 16px;border-radius:9px;font-weight:700;color:var(--sub);min-height:36px}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.sp{flex:1}
.btn-primary{background:var(--navy);color:#fff;padding:0 18px;border-radius:12px;font-weight:800;min-height:44px}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px 24px;max-width:1480px;margin:0 auto;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 4px rgba(15,23,42,.05)}
/* calendar (existing app style: square cells, dots at bottom) */
.cal-head{display:flex;align-items:center;gap:8px;padding:18px 20px 6px}
.cal-head h2{margin:0;font-size:19px;flex:1}
.arrow{width:38px;height:38px;border-radius:50%;background:#f2f4f6;font-size:13px;color:#4e5968}
.today-btn{height:38px;padding:0 14px;border-radius:19px;background:#f2f4f6;font-weight:700;font-size:13px;color:#4e5968}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:8px 20px 12px;align-items:center}
.flabel{font-size:12px;font-weight:700;color:var(--sub);margin-right:2px}
.fchip{padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);font-size:12.5px;font-weight:700;color:#4e5968;background:#fff;min-height:36px}
.fchip.on{border-color:var(--brand);background:var(--brand-soft);color:#3b34a8}
.weekdays,.cells{display:grid;grid-template-columns:repeat(7,1fr)}
.weekdays{padding:0 16px}
.wd{text-align:center;font-size:12px;font-weight:700;color:var(--sub);padding:6px 0}
.wd.sun{color:var(--red)}.wd.sat{color:var(--blue)}
.cells{gap:6px;padding:6px 16px 18px}
.cell{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-size:15px;font-weight:600;cursor:pointer;border:2px solid transparent;transition:background .12s}
.cell:hover:not(.dim){background:#f2f4f6}
.cell.dim{color:#cbd5e1}
.cell.today{border-color:var(--brand)}
.cell.past:not(.dim){color:#9aa5b1}
.cell.past .dot{opacity:.45}
.cell.sel{background:var(--brand)!important;color:#fff!important;box-shadow:0 4px 12px rgba(92,83,219,.35)}
.cell.sel .dot{background:#fff!important}
.dots{display:flex;gap:3px;position:absolute;bottom:9px}
.dot{width:6px;height:6px;border-radius:50%}
.dot.reg,.dot.add{background:var(--brand)}.dot.show{background:var(--red)}.dot.one{background:#10b981}
/* series filter = square mark on the matching dates */
.cell.mark{border-color:#8b83f0;background:#f6f5ff;border-radius:10px}
.cell.mark.on{background:#e4e1ff;border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.cell.faded:not(.sel):not(.mark){opacity:.38}
.legend{display:flex;gap:16px;padding:0 20px 16px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
/* panel */
.panel{padding:20px;min-height:620px;display:flex;flex-direction:column;gap:16px;position:relative}
.p-top{display:flex;align-items:flex-start;gap:12px}
.p-top .grow{flex:1;min-width:0}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:800}
.p-title{font-size:21px;font-weight:800;margin:0;letter-spacing:-.02em}
.p-meta{margin-top:6px;color:var(--sub);font-size:13px;line-height:1.6}
.noti{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);background:#f2f4f6;border-radius:999px;padding:4px 6px 4px 10px;white-space:nowrap}
.noti b{color:var(--ink);letter-spacing:2px}
.noti button{color:var(--brand);font-weight:800;font-size:11px;padding:2px 6px}
.kebab{width:40px;height:40px;border-radius:12px;background:#f2f4f6;font-size:18px;font-weight:800;color:#4e5968;position:relative}
.menu{position:absolute;right:20px;top:92px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;min-width:190px;z-index:5;display:none}
.menu.open{display:block}
.menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 12px;border-radius:10px;font-weight:700;min-height:44px}
.menu button:hover{background:#f2f4f6}
.menu .danger{color:#dc2626}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.tabs{display:flex;gap:4px;background:#f2f4f6;padding:4px;border-radius:12px}
.tabs button{flex:1;padding:10px 0;border-radius:9px;font-weight:800;color:var(--sub);min-height:44px}
.tabs button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.dtabs{display:flex;gap:6px;flex-wrap:wrap}
.dtab{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);font-weight:700;font-size:13px;color:#4e5968;min-height:40px}
.dtab.on{border-color:var(--brand);background:var(--brand-soft);color:#3b34a8}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border-radius:14px;padding:14px 12px;background:#f8f9fb}
.tile .n{font-size:26px;font-weight:800;line-height:1.1}
.tile .l{font-size:12px;color:var(--sub);font-weight:700;margin-top:2px}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:#eef0f3}
.bar i{display:block}
.sec-title{font-size:13px;font-weight:800;color:#4e5968;margin:2px 0 8px;display:flex;justify-content:space-between}
.sec-title span{font-weight:600;color:var(--sub);font-size:12px}
.rows{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #f1f3f5;min-height:48px}
.row:last-child{border-bottom:0}
.row .nm{font-weight:700;flex:1}
.row .pt{font-size:12px;color:var(--sub);width:60px}
.pill{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px}
.pill.g{background:#dcfce7;color:#15803d}.pill.o{background:#ffedd5;color:#c2410c}.pill.y{background:#fef3c7;color:#b45309}.pill.n{background:#f1f5f9;color:#64748b}
.mini{padding:6px 10px;border-radius:8px;border:1.5px solid var(--line);font-size:12px;font-weight:700;min-height:34px}
/* form (mirrors the app's existing controls) */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}
.lab{display:block;font-size:12px;font-weight:700;color:#4e5968;margin-bottom:6px}
.field{width:100%;min-height:46px;border:1.5px solid #e2e8f0;background:#f8fafc;border-radius:12px;padding:0 14px;display:flex;align-items:center;gap:8px;font-weight:600;font:inherit;text-align:left}
.field.sel{justify-content:space-between}
.dd{margin-top:6px;border:1px solid #cbd5e1;border-radius:12px;padding:10px;box-shadow:0 8px 24px rgba(15,23,42,.12);display:none;background:#fff}
.dd.open{display:block}
.dd .hd{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid #f1f5f9;margin-bottom:8px;font-size:12px;font-weight:700;color:#475569}
.dd .hd button{color:var(--brand);background:#eef2ff;padding:3px 8px;border-radius:6px;font-size:11.5px;font-weight:700}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.parts label{display:flex;gap:8px;align-items:center;padding:10px;border-radius:8px;background:#eef2ff;border:1px solid #c7d2fe;font-weight:700;color:#4f46e5;font-size:13px;min-height:44px}
.parts input{width:16px;height:16px;accent-color:#4f46e5}
.custom{margin-top:8px;width:100%;padding:10px;border-radius:8px;background:#f0fdfa;border:1px solid #99f6e4;color:#0f766e;font-weight:700;font-size:12.5px;min-height:44px}
.checkcard{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1.5px solid #e2e8f0;background:#f8fafc;cursor:pointer}
.checkcard.on{border-color:#4f46e5;background:#eef2ff}
.checkcard input{width:20px;height:20px;accent-color:#4f46e5;margin-top:1px}
.checkcard b{display:block;font-size:13.5px}
.checkcard span{font-size:12px;color:var(--sub);line-height:1.45}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios button{padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;font-weight:700;font-size:13px;min-height:44px}
.radios button.on{border-color:var(--brand);background:var(--brand-soft);color:#3b34a8}
.scope{border:1.5px dashed #c7d2fe;border-radius:12px;padding:12px;background:#fafaff}
.scope label{display:flex;gap:8px;align-items:center;padding:6px 0;font-weight:700;font-size:13px}
.scope input{width:18px;height:18px;accent-color:var(--brand)}
.save{width:100%;min-height:50px;border-radius:12px;background:var(--navy);color:#fff;font-weight:800;font-size:15px}
/* series panel */
.srow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid #f1f3f5;min-height:50px;cursor:pointer}
.srow:last-child{border-bottom:0}
.srow input{width:20px;height:20px;accent-color:var(--brand)}
.srow .dt{font-weight:800;width:90px}
.srow .tm{color:var(--sub);flex:1}
.srow.off{opacity:.5;cursor:not-allowed;background:#fafbfc}
.bulk{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.bulk>input{width:20px;height:20px;accent-color:var(--brand)}
.bulk .k{min-width:84px;font-weight:800;font-size:13px}
.bulk .field{flex:1}
.empty{margin:auto;text-align:center;color:var(--sub)}
.hint{font-size:12px;color:var(--sub);line-height:1.5}
.eye{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);font-weight:800;font-size:12px;color:#4e5968;min-height:40px;touch-action:none;user-select:none;-webkit-user-select:none}
.eye:active,.eye.lock{border-color:var(--brand);background:var(--brand-soft);color:#3b34a8}
.pbar .vbar,.pbar .abar{position:absolute;left:0;top:0;bottom:0}
.eyebtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:#4e5968;background:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
.eyebtn.on,.eyebtn:active{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.pbar .abar.ex{background:#22c55e}
.plines{display:flex;flex-direction:column;gap:2px}
.pl{font-size:12.5px;font-weight:600;color:var(--sub)}.pl.cur{color:var(--ink);font-weight:800}
.dl{font-style:normal;font-size:11px;font-weight:800;margin-left:6px;padding:1px 6px;border-radius:6px}
.dl.up{background:#dcfce7;color:#15803d}.dl.dn{background:#f1f5f9;color:#64748b}
.fdd{position:relative}
.fbtn{display:flex;align-items:center;gap:10px;justify-content:space-between;min-width:230px;padding:0 14px;min-height:40px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;background:#fff}
.fbtn.on{border-color:var(--brand);background:var(--brand-soft);color:#3b34a8}
.fmenu{display:none;position:absolute;left:0;top:46px;z-index:6;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;min-width:300px}
.fmenu.open{display:block}
.fopt{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;min-height:44px;cursor:pointer}
.fopt:hover{background:#f6f7f9}
.fopt input{width:18px;height:18px;accent-color:var(--brand)}
.fopt .fn{flex:1;font-weight:700}.fopt .fc{font-size:12px;color:var(--sub)}
.fft{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:4px;padding:6px 6px 2px}
.fft button{font-size:12.5px;font-weight:700;color:var(--sub);padding:8px;min-height:36px}
.fft .manage{color:var(--brand)}
.grow-item{display:flex;align-items:center;gap:10px;margin:6px 16px 0;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);text-align:left;min-height:62px}
.grow-item.on{border-color:var(--brand);background:#f6f5ff}
.modetag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800}
.modetag.vote{background:#dbeafe;color:#1d4ed8}.modetag.att{background:#dcfce7;color:#15803d}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{background:#f8f9fb;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ph{display:flex;align-items:center;justify-content:space-between}
.pbadge{font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px}
.prate{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.pbar{position:relative;height:8px;background:#e8ebef;border-radius:999px}
.pbar i{display:block;height:100%;border-radius:999px;transition:width .25s}
.pbar u{position:absolute;top:-3px;width:2px;height:14px;background:#191f28;border-radius:2px;transition:left .25s}
.pdet{font-size:12px;color:#4e5968;font-weight:700}.pdet.sub{color:var(--sub);font-weight:600;margin-top:-4px}
@media (max-width:1000px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="note">목업 v6 · 가짜 데이터, 아무것도 저장되지 않습니다. 날짜, 카드 필터(드롭다운), 눈 버튼, ‘카드 관리’를 눌러보세요.</div>
<div class="top">
  <h1>🎵 관리자</h1>
  <div class="seg"><button>단원</button><button class="on">일정</button><button>설정</button></div>
  <div class="sp"></div>
  <button class="btn-primary" onclick="openNew()">+ 일정 등록</button>
</div>

<div class="wrap">
  <section class="card" id="left">
    <div style="padding:14px 20px 0"><div class="seg" id="viewseg" style="display:inline-flex"><button data-v="cal" class="on" onclick="setView('cal')">달력</button><button data-v="groups" onclick="setView('groups')">카드 관리</button></div></div>
    <div id="calView">
    <div class="cal-head">
      <button class="arrow" onclick="moveMonth(-1)">◀</button>
      <h2 id="mtitle"></h2>
      <button class="arrow" onclick="moveMonth(1)">▶</button>
      <button class="today-btn" onclick="goToday()">오늘</button>
    </div>
    <div class="filters" id="filters"></div>
    <div class="weekdays"><span class="wd sun">일</span><span class="wd">월</span><span class="wd">화</span><span class="wd">수</span><span class="wd">목</span><span class="wd">금</span><span class="wd sat">토</span></div>
    <div class="cells" id="cells"></div>
    <div class="legend"><span><i style="background:#5C53DB"></i>정기·추가연습</span><span><i style="background:#10b981"></i>행사</span><span><i style="background:#ef4444"></i>연주</span><span>지난 날짜는 흐리게</span></div>
    </div>
    <div id="groupView" style="display:none"><div style="padding:14px 20px 4px"><h2 style="margin:0;font-size:19px">카드 관리</h2><div class="hint" style="margin-top:4px">반복으로 만든 일정도, 직접 묶은 일정도 모두 카드로 관리합니다.</div></div><div id="glist" style="display:flex;flex-direction:column;padding-bottom:12px"></div></div>
  </section>
  <section class="card panel" id="panel"></section>
</div>

<script>
const T0='2026-10-23', pad=n=>String(n).padStart(2,'0'), DOW=['일','월','화','수','목','금','토'];
const S=[]; const add=(d,t,title,cat,series,place,vote,att)=>S.push({id:'s'+S.length,date:d,time:t,end:cat==='show'?'17:00':(t==='19:30'?'22:00':(t==='10:00'?'12:30':'21:00')),title,cat,series,place,vote,att});
['2026-10-01','2026-10-08','2026-10-15','2026-10-22'].forEach((d,i)=>add(d,'19:30','문콰이어 정기연습','reg','reg','문콰이어 정기연습실',null,{p:[22,23,21,24][i],l:[2,1,3,1][i],m:[4,4,4,3][i]}));
['2026-10-29','2026-11-05','2026-11-12','2026-11-19','2026-11-26'].forEach((d,i)=>add(d,'19:30','문콰이어 정기연습','reg','reg','문콰이어 정기연습실',{a:[14,9,6,3,2][i],b:[3,2,1,0,0][i],u:[11,17,21,25,26][i]},null));
['2026-10-24','2026-10-31','2026-11-07'].forEach((d,i)=>add(d,'10:00','인천성가제 추가연습','add','inc','문콰이어 정기연습실',{a:[19,15,8][i],b:[2,3,1][i],u:[7,10,19][i]},null));
add('2026-10-27','20:00','홍콩출장단 추가연습','add',null,'문콰이어 정기연습실',{a:11,b:1,u:4},null);
add('2026-11-07','14:00','조미진 단원 결혼식 축가','one',null,'(예든)웨딩홀',{a:12,b:2,u:14},null);
add('2026-11-14','13:00','인천성가제','show',null,'인천 서해문화회관',{a:6,b:1,u:21},null);
S.forEach(x=>{ if(x.series==='reg') x.card='reg'; else if(x.series==='inc'||x.title==='인천성가제') x.card='incprep'; else x.card='misc'; });
const GROUPS={reg:{n:'2026 하반기 정기연습'},incprep:{n:'인천성가제 준비'},misc:{n:'비정기 행사'}};
const inGroup=(x,k)=>x.card===k;
const groupsOf=x=>Object.keys(GROUPS).filter(k=>inGroup(x,k));
const inSel=x=>[...fsel].some(k=>inGroup(x,k));
const PARTS=[['소프라노',9,'#ec4899'],['알토',8,'#8b5cf6'],['테너',5,'#3b82f6'],['베이스',6,'#0891b2']];
function spread(total){ const sum=PARTS.reduce((a,p)=>a+p[1],0); const raw=PARTS.map(p=>total*p[1]/sum); const out=raw.map(Math.floor); let rest=total-out.reduce((a,b)=>a+b,0); raw.map((r,i)=>[r-Math.floor(r),i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{ if(rest>0){out[i]++;rest--} }); return out.map((n,i)=>Math.min(n,PARTS[i][1])); }
const DEMO={}; const d22=S.find(x=>x.date==='2026-10-22'); DEMO[d22.id]={vote:[7,7,4,3],att:[0,5,4,5]};
function partData(x){ if(DEMO[x.id]) return {...DEMO[x.id],started:true}; const voteTotal=x.vote?x.vote.a:(x.att?x.att.p+x.att.l+2:0); const attTotal=x.att?x.att.p+x.att.l:0; return {vote:spread(voteTotal),att:spread(attTotal),started:!!x.att}; }
let hold=false,lock=false,downAt=0;
const CAT={reg:['정기연습','#eef0ff','#3b34a8'],add:['추가연습','#ecfdf5','#047857'],one:['행사','#fef3c7','#92400e'],show:['연주','#fee2e2','#991b1b']};

function renderGroupList(){
  document.getElementById('glist').innerHTML=Object.keys(GROUPS).map(k=>{ const l=S.filter(x=>inGroup(x,k)).sort((a,b)=>a.date.localeCompare(b.date)); const up=l.filter(x=>x.date>=T0).length;
    return `<button class="grow-item ${gsel===k?'on':''}" onclick="gsel='${k}';renderAll()"><div style="flex:1;min-width:0"><div style="font-weight:800;font-size:15px">${GROUPS[k].n}</div><div class="hint" style="margin-top:2px">${l[0].date.slice(5).replace('-','/')} ~ ${l[l.length-1].date.slice(5).replace('-','/')} · 전체 ${l.length}개 · 남은 ${up}개</div></div><span style="color:#94a3b8">›</span></button>`; }).join('')+`<button class="btn-primary" style="margin:12px 16px 4px;width:calc(100% - 32px)" onclick="alert('목업: 새 카드 만들기')">+ 새 카드 만들기</button>`;
}
function clickDate(d){
  const dt=new Date(d+'T00:00:00'); if(dt.getMonth()!==M){Y=dt.getFullYear();M=dt.getMonth()}
  if(mode==='series'){ const ev=byDate(d).find(e=>inSel(e)&&d>=T0); if(ev){togglePick(ev.id);return} }
  sel=d;dtab=0;tab='status';mode='day';menuOpen=false;renderAll();
}
function togglePick(id){ picked.has(id)?picked.delete(id):picked.add(id); renderAll(); }
function allUpcoming(){ S.filter(s=>inSel(s)&&s.date>=T0).forEach(s=>picked.add(s.id)); renderAll(); }
function syncMode(){ picked.clear(); if(fsel.size){mode='series'; S.filter(s=>inSel(s)&&s.date>=T0).forEach(s=>picked.add(s.id));} else mode='day'; }
function toggleFilter(k){ fsel.has(k)?fsel.delete(k):fsel.add(k); syncMode(); renderAll(); }
function clearFilter(){ fsel.clear(); syncMode(); renderAll(); }
function toggleFOpen(e){ e.stopPropagation(); fOpen=!fOpen; renderFilters(); }
function setView(v){ view=v; fOpen=false; renderAll(); }
function openNew(){ mode='new'; renderAll(); }
function toggleMenu(e){ e.stopPropagation(); menuOpen=!menuOpen; renderPanel(); }
document.addEventListener('click',()=>{ if(menuOpen){menuOpen=false;const m=document.getElementById('menu'); if(m)m.classList.remove('open');} if(fOpen){fOpen=false;renderFilters();} });
function moveMonth(n){ M+=n; if(M<0){M=11;Y--} if(M>11){M=0;Y++} renderAll(); }
function goToday(){ Y=2026;M=9;sel=T0;mode='day';fsel.clear();picked.clear();renderAll(); }
function renderAll(){
  document.getElementById('calView').style.display=view==='cal'?'block':'none';
  document.getElementById('groupView').style.display=view==='groups'?'block':'none';
  document.querySelectorAll('#viewseg button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  if(view==='cal'){ renderFilters(); renderCells(); renderPanel(); }
  else { renderGroupList(); document.getElementById('panel').innerHTML=groupPanel(); }
}
renderAll();
</script>
</body>
</html>
